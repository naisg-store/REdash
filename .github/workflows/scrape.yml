name: Daily HB Permit Scraper

on:
  schedule:
    - cron: '0 10 * * *' # Runs every day at 3:00 AM UTC
  workflow_dispatch: # Allows you to click a button to run it manually anytime

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium
          playwright install-deps chromium

      - name: Run HB Scraper
        run: python hb_scraper.py
        
      - name: Run Newport Beach Scraper
        run: python nb_scraper.py

      - name: Commit and push if leads changed
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add leads.json nb_leads.json
          git commit -m "Auto-update daily leads [skip ci]" || echo "No changes to commit"
          git pull --rebase origin main
          git push
